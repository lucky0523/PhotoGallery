[uwsgi]

; 工作目录（Docker 中统一用 /app）
chdir = /app

; 标准 module 写法（你的 manage.py 已设置 DJANGO_SETTINGS_MODULE = 'PhotoGallery.settings'）
module = PhotoGallery.wsgi:application

; 推荐 http-socket（轻量，worker 直接说 HTTP）
http-socket = 0.0.0.0:8000
; 或者如果你以后加 Nginx，用 socket 模式：
; socket = /tmp/uwsgi.sock
; chmod-socket = 666

master = true
workers = 4               ; 根据 CPU 调整，建议 2×核数
threads = 2               ; 每个 worker 的线程数
; processes = 4           ; 和 workers 类似，选一个就好

; 安全：不使用 root
uid = appuser
gid = appuser

; 关键：不要 daemonize！日志直接输出到 stdout
; 去掉 daemonize 和 logto（或设为 --logto - 但默认就是 stdout）

buffer-size = 32768       ; 处理大 header / 上传时有用
max-requests = 2000       ; 防止内存泄漏
reload-mercy = 10
vacuum = true

; 可选：如果想保留部分日志文件（不推荐，docker logs 就够）
; logto = /dev/stdout

; 静态文件映射（开发/简单场景可用，生产建议 Nginx）
static-map = /static=/app/staticfiles
; 如果有 media 文件夹（dynamic）
; static-map = /media=/app/dynamic