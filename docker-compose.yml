services:
  web:
    build: .
    image: photo-gallery:uwsgi
    container_name: photo-gallery
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=PhotoGallery.settings
      - PRODUCTION=true
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine   # ← 改成 alpine 版，更小更省资源（推荐）
    container_name: photo-gallery-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      # - "443:443/udp"   # 如果想支持 HTTP/3，可加
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:             # ← 可选：显式网络（默认 compose 会创建）
      - default

volumes:
  caddy_data:
  caddy_config:
