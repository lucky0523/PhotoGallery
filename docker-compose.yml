services:
  web:
    build: .
    image: photo-gallery:uwsgi
    container_name: photo-gallery
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles  # collectstatic 写入这里
    environment:
      - DJANGO_SETTINGS_MODULE=PhotoGallery.settings
      - PRODUCTION=true
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: photo-gallery-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_volume:/srv/static:ro   # 与 web 共享，只读
      - ./data/dynamic:/srv/media:ro   # 媒体文件，只读

volumes:
  caddy_data:
  caddy_config:
  static_volume:  # 共享静态文件卷
