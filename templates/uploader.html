<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>上传图片</title>
</head>
<body>
{% include 'backend_header.html' %}

{% if msg %}
<div id="msg_block" style="background-color: #fff3cd; padding: 12px 16px; border-radius: 4px; border: 1px solid #ffc107; color: #856404; margin-bottom: 16px;">{{ msg }}</div>
{% endif %}
<form action="/uploader" method="post" enctype="multipart/form-data" id="upload_form">
    <p><input type="file" name="file" accept="image/*" id="file_input" multiple></p>
    <input type="hidden" name="file_mtime" id="file_mtime">
    <label><input type="radio" name="is_film" value="False" checked>数码
        <input type="radio" name="is_film" value="True">胶片</label>
    <button type="submit" name="action" value="upload_to_buffer">上传至缓冲区</button>
</form>
<script>
    document.getElementById('file_input').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            var file = e.target.files[0];
            document.getElementById('file_mtime').value = file.lastModified;
        }
    });
</script>
<br>
<form action="/uploader" method="post" enctype="multipart/form-data">
    <input type="hidden" name="amount" value="all">
    <button type="submit" name="action" value="add_to_album">全部添加至相册</button>
</form>
<br>
{% for item in photos %}
    <div style="display: flex; align-items: center;">
        <img src="{{ item.thumbnail }}" style="width:300px; height:auto;">
        <div>
            <p style="margin-left: 10px;">{{ item.device }}</p>
            <p style="margin-left: 10px;">{{ item.time }}</p>
            <p style="margin-left: 10px;">{{ item.formatted_name }}</p>
            {% if item.is_film %}
                <p style="margin-left: 10px;">胶片</p>
            {% else %}
                <p style="margin-left: 10px;">数码</p>
            {% endif %}
            <form style="margin-left: 10px;" action="/uploader" method="post">
                <label>
                    <input type="hidden" name="amount" value="one">
                    <input type="hidden" name="is_film" value="{{ item.is_film }}">
                    <input onfocus=this.blur() type="text" name="path" size="50" value="{{ item.image }}">
                </label>
                <button type="submit" name="action" value="add_to_album">添加一张至相册</button>
                <br>
                <button type="submit" name="action" value="remove_from_buffer">在缓冲区中删除</button>
            </form>
        </div>
    </div>
    <br>
{% endfor %}
</body>
</html>
